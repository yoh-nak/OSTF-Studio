name: OSTF Studio cross-platform build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            configure_args: '-G "Visual Studio 17 2022" -A x64'
          - name: macOS-arm64
            os: macos-15
            configure_args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure standalone core
        run: cmake -S . -B build-core ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=OFF
      - name: Build standalone core
        run: cmake --build build-core --config Release --parallel 2
      - name: Test standalone core
        run: ctest --test-dir build-core -C Release --output-on-failure --no-tests=error
      - name: Configure (JUCE pinned tag 9.0.5)
        run: cmake -S . -B build ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          $exe = 'build/OSTFStudio_artefacts/Release/OSTF Studio.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing build output: $exe" }
          Compress-Archive -LiteralPath $exe -DestinationPath 'dist/OSTF_Studio_Windows_x64.zip' -Force
      - name: Package macOS preview (unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          app='build/OSTFStudio_artefacts/Release/OSTF Studio.app'
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/OSTF_Studio_macOS_arm64_unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSTF-Studio-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
