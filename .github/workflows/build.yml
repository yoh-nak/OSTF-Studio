name: OSTF Studio cross-platform build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: Build artifacts only, or explicitly publish a release
        type: choice
        options: [none, stable, prerelease]
        default: none
      release_tag:
        description: New release tag (for example v1.0.0-public-alpha.1)
        type: string

concurrency:
  group: studio-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            arch: x64
            configure_args: '-DOSTF_STUDIO_ENABLE_ASIO=ON'
          - name: macOS-arm64
            os: macos-15
            arch: arm64
            configure_args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
          - name: macOS-x86_64
            os: macos-15-intel
            arch: x86_64
            configure_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up the Windows compiler for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Identify the native toolchain and build budget
        shell: bash
        run: |
          set -euo pipefail
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(python tools/build.py --jobs-only)" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            compiler=$(python -c "import os; print(os.environ['VCToolsVersion'], os.environ['WindowsSDKVersion'])")
          else
            compiler="$(clang --version | head -1)-$(xcrun --show-sdk-version)"
          fi
          compiler_key=$(printf '%s' "$compiler" | git hash-object --stdin)
          echo "SCCACHE_GHA_VERSION=studio-v1-${{ matrix.name }}-Release-$compiler_key-juce9.0.5-jsoncons1.5.0" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.10.0
      - name: Reuse pinned third-party downloads
        uses: actions/cache@v4
        with:
          path: |
            build-tools/vendor-cache
            build-tools/fluid-soundfont-gm_3.1-6_all.deb
          key: vendor-v1-${{ runner.os }}-juce-d60b7a78-jsoncons-6de746d3-${{ hashFiles('packaging/prepare_fluid_r3.py') }}
      - name: Materialize the pinned JUCE source
        shell: bash
        run: |
          set -euo pipefail
          vendor=build-tools/vendor-cache/juce.git
          mkdir -p build-tools/vendor-cache build/_deps
          if [[ ! -d "$vendor" ]]; then
            git clone --bare --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git "$vendor"
          fi
          git clone --no-checkout "$vendor" build/_deps/juce-src
          git -C build/_deps/juce-src checkout --detach d60b7a78030661574a615b586d9325ba7a7fa7dd
      - name: Resolve package version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'none' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash packaging/release-version.sh
      - name: Test alpha release version policy
        shell: bash
        run: bash tests/release-version.sh
      - name: Check installer catalogue and choices
        run: python tests/installer_choices.py
      - name: Exercise macOS installer dependencies
        if: runner.os == 'macOS'
        run: python3 tests/installer_choices.py --mac-dependency-install
      - name: Check illustrated manuals and device inventory
        run: python tests/illustrated_guides.py
      - name: Configure standalone core
        run: cmake -S . -B build-core -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=OFF
      - name: Build standalone core
        run: cmake --build build-core --config Release
      - name: Test standalone core
        run: ctest --test-dir build-core -C Release --output-on-failure --no-tests=error
      - name: Record the current official OSTF specification
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=yoh-nak/Open-Song-Timeline-Format
          revision=$(gh api "repos/$repo/commits/HEAD" --jq .sha)
          echo "[Official OSTF status](https://github.com/$repo/blob/$revision/STATUS.json)" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$repo/contents/STATUS.json?ref=$revision" -H "Accept: application/vnd.github.raw+json" |
            jq -r '.specification | "Baseline \(.sourceBaselineVersion), target \(.targetVersion), state \(.state)"' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out pinned OSTF 5.1 demo schemas
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          repository: yoh-nak/Open-Song-Timeline-Format-5.1
          ref: 957bd071cecc58a12f417ad212c40723ba9812ca
          path: build-tools/ostf-reference
          persist-credentials: false
      - name: Verify demo scores, production sessions and routing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ostf-verify"
          "$RUNNER_TEMP/ostf-verify/bin/pip" install jsonschema==4.25.1
          "$RUNNER_TEMP/ostf-verify/bin/python" examples/demo-songs/verify.py build-tools/ostf-reference
      - name: Prepare licensed FluidR3 GM bank
        run: python packaging/prepare_fluid_r3.py
      - name: Configure (JUCE pinned tag 9.0.5)
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache -DFETCHCONTENT_SOURCE_DIR_JUCE="${{ github.workspace }}/build/_deps/juce-src" -DOSTF_DOWNLOAD_DIR="${{ github.workspace }}/build-tools/vendor-cache/downloads" ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=ON -DOSTF_STUDIO_DISPLAY_VERSION=${{ steps.version.outputs.display }}
      - name: Build
        shell: bash
        run: |
          test "$(git -C build/_deps/juce-src rev-parse HEAD)" = d60b7a78030661574a615b586d9325ba7a7fa7dd
          cmake --build build --config Release
      - name: Run tests
        id: tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Diagnose an aborted macOS smoke test
        if: failure() && steps.tests.outcome == 'failure' && runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          build = pathlib.Path("build")
          failed = {s.split(":", 1)[1] for s in (build / "Testing/Temporary/LastTestsFailed.log").read_text().splitlines()}
          catalog = json.loads(subprocess.check_output(["ctest", "--test-dir", str(build), "-C", "Release", "--show-only=json-v1"]))
          for test in catalog["tests"]:
              if test["name"] in failed & {"ostf_studio_plugin_focus", "ostf_scale_instrument_tests"}:
                  print("Debugger trace for", test["name"], flush=True)
                  subprocess.run(["xcrun", "lldb", "--batch", "-o", "run", "-k", "thread backtrace", "--", *test["command"]], timeout=120)
          PY
      - name: Package Windows installer and Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.display }}
          BINARY_VERSION: ${{ steps.version.outputs.binary }}
        run: |
          ./packaging/windows/Package.ps1 -AppVersion $env:APP_VERSION -BinaryVersion $env:BINARY_VERSION
          python tests/installer_choices.py --windows-wizard "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - name: Verify app-only install and repair with a loaded VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $oldRoot = Join-Path $env:LOCALAPPDATA 'Programs/Common/VST3'
          $null = New-Item -ItemType Directory -Force -Path $oldRoot
          Copy-Item -Recurse -LiteralPath 'build/OSTFGMSoundModule_artefacts/Release/VST3/OSTF GM Sound Module.vst3' -Destination $oldRoot
          $other = New-Item -ItemType Directory -Path (Join-Path $oldRoot 'Third Party Test.vst3')
          $setup = (Resolve-Path 'dist/OSTF_Studio_Windows_x64_Setup.exe').Path
          function Install-Studio([string] $tasks) {
            $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- $tasks" -WindowStyle Hidden -PassThru
            if (-not $install.WaitForExit(240000) -or $install.ExitCode -ne 0) { throw "Setup failed with $tasks" }
          }
          $shared = Join-Path $env:CommonProgramFiles 'VST3/OSTF Studio/OSTF GM Sound Module.vst3/Contents'
          $dir = New-Item -ItemType Directory -Force -Path (Join-Path $shared 'x86_64-win')
          $dll = Join-Path $dir.FullName 'OSTF GM Sound Module.vst3'
          Copy-Item -LiteralPath (Join-Path $oldRoot 'OSTF GM Sound Module.vst3/Contents/x86_64-win/OSTF GM Sound Module.vst3') -Destination $dll
          $metadata = Join-Path $shared 'Resources/moduleinfo.json'
          $lock = [IO.File]::Open($dll, 'Open', 'Read', 'Read')
          try {
            Install-Studio '/TYPE=custom /COMPONENTS="effects\Of02" /TASKS=sharedvst3'
            if (!(Test-Path (Join-Path $env:CommonProgramFiles 'VST3/OSTF Studio/OSTF Chorus.vst3/Contents/Resources/moduleinfo.json')) -or
                (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/OSTF Studio/OSTF Studio.exe')) -or
                (Test-Path 'HKCU:\Software\Classes\OSTFStudio.Score')) { throw 'Plug-in-only setup did not isolate the Studio payload' }
            Install-Studio '/TYPE=apponly /MERGETASKS=!sharedvst3'
            if (!(Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs/OSTF Studio/OSTF Studio.exe')) -or
                (Test-Path -LiteralPath $metadata) -or !(Test-Path -LiteralPath (Join-Path $oldRoot 'OSTF GM Sound Module.vst3'))) {
              throw 'App-only setup touched plug-ins or failed to install Studio'
            }
            Install-Studio '/TYPE=custom /COMPONENTS="studio,composition\Ose1" /TASKS=sharedvst3'
            $selected = Join-Path $env:CommonProgramFiles 'VST3/OSTF Studio/OSTF Scale Editor.vst3/Contents/x86_64-win/OSTF Scale Editor.vst3'
            $omitted = Join-Path $env:CommonProgramFiles 'VST3/OSTF Studio/OSTF Reverb.vst3'
            if (!(Test-Path -LiteralPath $selected -PathType Leaf) -or (Test-Path -LiteralPath $omitted) -or
                (Test-Path -LiteralPath $metadata) -or !(Test-Path -LiteralPath (Join-Path $oldRoot 'OSTF GM Sound Module.vst3'))) {
              throw 'Custom selection installed or migrated unexpected plug-ins'
            }
            Install-Studio '/TYPE=full /TASKS=sharedvst3'
            if (!(Test-Path -LiteralPath $metadata)) { throw 'Setup did not repair the incomplete locked bundle' }
          } finally { $lock.Dispose() }
          if ((Test-Path -LiteralPath (Join-Path $oldRoot 'OSTF GM Sound Module.vst3')) -or
              -not (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'OSTF Studio/Previous VST3/OSTF GM Sound Module.vst3')) -or
              -not (Test-Path -LiteralPath $other.FullName)) { throw 'Unexpected legacy VST3 migration' }
          $names = @('OSTF Studio', 'OSTF GM Sound Module') + @((Get-Content src/plugins/effects/catalog.json -Raw | ConvertFrom-Json).name) + @((Get-Content src/plugins/instruments/catalog.json -Raw | ConvertFrom-Json).name)
          foreach ($name in $names) {
            $path = Join-Path $env:CommonProgramFiles "VST3/OSTF Studio/$name.vst3/Contents/x86_64-win/$name.vst3"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Shared VST3 is missing: $path" }
          }
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 packaging/macos_package.py '${{ steps.version.outputs.binary }}' --arch '${{ matrix.arch }}' --display-version '${{ steps.version.outputs.display }}'
      - name: Verify macOS plug-in selection and full install
        if: runner.os == 'macOS'
        shell: bash
        run: |
          volume=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$volume" dist/OSTF_Studio_macOS_${{ matrix.arch }}.dmg
          trap 'hdiutil detach "$volume"' EXIT
          pkg="$volume/Install OSTF Studio and VST3.pkg"
          changes="$RUNNER_TEMP/studio-choices.plist"
          python3 tests/installer_choices.py --mac-selection "$changes"
          sudo installer -pkg "$pkg" -target / -applyChoiceChangesXML "$changes"
          set -x
          test -x '/Applications/OSTF Studio.app/Contents/MacOS/OSTF Studio'
          plugins='/Library/Audio/Plug-Ins/VST3'
          test -d "$plugins/OSTF Scale Editor.vst3"
          test ! -e "$plugins/OSTF GM Sound Module.vst3"
          test ! -e "$plugins/OSTF Reverb.vst3"
          sudo installer -pkg "$pkg" -target /
          test -x '/Applications/OSTF Studio.app/Contents/MacOS/OSTF Studio'
          while IFS= read -r name; do
            lipo "$plugins/$name.vst3/Contents/MacOS/$name" -verify_arch ${{ matrix.arch }}
          done < <(jq -sr '["OSTF Studio", "OSTF GM Sound Module", (.[][] | .name)][]' src/plugins/effects/catalog.json src/plugins/instruments/catalog.json)
      - name: Package corresponding source and build inputs
        if: matrix.arch == 'arm64'
        shell: bash
        run: bash packaging/package-source.sh
      - name: Include the release version in download names
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'none'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.display }}
        run: |
          for asset in dist/OSTF_Studio_*; do
            test -s "$asset"
            mv "$asset" "dist/OSTF_Studio_${PACKAGE_VERSION}_${asset#dist/OSTF_Studio_}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OSTF-Studio-${{ matrix.name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.release_type == 'stable' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: OSTF-Studio-*
          path: dist
          merge-multiple: true
      - name: Create version tag and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: bash packaging/publish-release.sh
