name: OSTF Studio cross-platform build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: Build artifacts only, or explicitly publish a release
        type: choice
        options: [none, stable, prerelease]
        default: none
      release_tag:
        description: New release tag (for example v1.0.0-alpha.1)
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            configure_args: '-G "Visual Studio 17 2022" -A x64 -DOSTF_STUDIO_ENABLE_ASIO=ON'
          - name: macOS-arm64
            os: macos-15
            configure_args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve package version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'none' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash packaging/release-version.sh
      - name: Test alpha release version policy
        shell: bash
        run: bash tests/release-version.sh
      - name: Configure standalone core
        run: cmake -S . -B build-core ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=OFF
      - name: Build standalone core
        run: cmake --build build-core --config Release --parallel 2
      - name: Test standalone core
        run: ctest --test-dir build-core -C Release --output-on-failure --no-tests=error
      - name: Check out the OSTF reference schemas
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          repository: yoh-nak/Open-Song-Timeline-Format-5.0
          ref: d8ce48ca6c873a5a24a94bcc80d847bf33135b46
          path: build-tools/ostf-reference
          persist-credentials: false
      - name: Verify demo scores, production sessions and routing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ostf-verify"
          "$RUNNER_TEMP/ostf-verify/bin/pip" install jsonschema==4.25.1
          "$RUNNER_TEMP/ostf-verify/bin/python" examples/demo-songs/verify.py build-tools/ostf-reference
      - name: Prepare licensed FluidR3 GM bank
        run: python packaging/prepare_fluid_r3.py
      - name: Configure (JUCE pinned tag 9.0.5)
        run: cmake -S . -B build ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=Release -DOSTF_STUDIO_BUILD_GUI=ON -DOSTF_STUDIO_DISPLAY_VERSION=${{ steps.version.outputs.display }}
      - name: Build
        shell: bash
        run: |
          test "$(git -C build/_deps/juce-src rev-parse HEAD)" = d60b7a78030661574a615b586d9325ba7a7fa7dd
          cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package Windows installer and Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.display }}
          BINARY_VERSION: ${{ steps.version.outputs.binary }}
        run: |
          ./packaging/windows/Package.ps1 -AppVersion $env:APP_VERSION -BinaryVersion $env:BINARY_VERSION
      - name: Verify app-only install and repair with a loaded VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $oldRoot = Join-Path $env:LOCALAPPDATA 'Programs/Common/VST3'
          $null = New-Item -ItemType Directory -Force -Path $oldRoot
          Copy-Item -Recurse -LiteralPath 'build/OSTFArranger_artefacts/Release/VST3/OSTF Arranger.vst3' -Destination $oldRoot
          $other = New-Item -ItemType Directory -Path (Join-Path $oldRoot 'Third Party Test.vst3')
          $setup = (Resolve-Path 'dist/OSTF_Studio_Windows_x64_Setup.exe').Path
          function Install-Studio([string] $tasks) {
            $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- $tasks" -WindowStyle Hidden -PassThru
            if (-not $install.WaitForExit(240000) -or $install.ExitCode -ne 0) { throw "Setup failed with $tasks" }
          }
          $shared = Join-Path $env:CommonProgramFiles 'VST3/OSTF Studio/OSTF Arranger.vst3/Contents'
          $dir = New-Item -ItemType Directory -Force -Path (Join-Path $shared 'x86_64-win')
          $dll = Join-Path $dir.FullName 'OSTF Arranger.vst3'
          Copy-Item -LiteralPath (Join-Path $oldRoot 'OSTF Arranger.vst3/Contents/x86_64-win/OSTF Arranger.vst3') -Destination $dll
          $metadata = Join-Path $shared 'Resources/moduleinfo.json'
          $lock = [IO.File]::Open($dll, 'Open', 'Read', 'Read')
          try {
            Install-Studio '/MERGETASKS=!sharedvst3'
            if (!(Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs/OSTF Studio/OSTF Studio.exe')) -or
                (Test-Path -LiteralPath $metadata) -or !(Test-Path -LiteralPath (Join-Path $oldRoot 'OSTF Arranger.vst3'))) {
              throw 'App-only setup touched plug-ins or failed to install Studio'
            }
            Install-Studio '/TASKS=sharedvst3'
            if (!(Test-Path -LiteralPath $metadata)) { throw 'Setup did not repair the incomplete locked bundle' }
          } finally { $lock.Dispose() }
          if ((Test-Path -LiteralPath (Join-Path $oldRoot 'OSTF Arranger.vst3')) -or
              -not (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'OSTF Studio/Previous VST3/OSTF Arranger.vst3')) -or
              -not (Test-Path -LiteralPath $other.FullName)) { throw 'Unexpected legacy VST3 migration' }
          $names = @('OSTF Arranger', 'OSTF GM Sound Module') + @((Get-Content src/plugins/effects/catalog.json -Raw | ConvertFrom-Json).name) + @((Get-Content src/plugins/instruments/catalog.json -Raw | ConvertFrom-Json).name)
          foreach ($name in $names) {
            $path = Join-Path $env:CommonProgramFiles "VST3/OSTF Studio/$name.vst3/Contents/x86_64-win/$name.vst3"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Shared VST3 is missing: $path" }
          }
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          app='build/OSTFStudio_artefacts/Release/OSTF Studio.app'
          test -d "$app"
          lipo "$app/Contents/MacOS/OSTF Studio" -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          dmg='dist/OSTF_Studio_macOS_arm64.dmg'
          staging=$(mktemp -d)
          ditto "$app" "$staging/OSTF Studio.app"
          ln -s /Applications "$staging/Applications"
          gm='build/OSTFGMSoundModule_artefacts/Release/VST3/OSTF GM Sound Module.vst3'
          lipo "$gm/Contents/MacOS/OSTF GM Sound Module" -verify_arch arm64
          arranger='build/OSTFArranger_artefacts/Release/VST3/OSTF Arranger.vst3'
          lipo "$arranger/Contents/MacOS/OSTF Arranger" -verify_arch arm64
          pkgroot=$(mktemp -d)
          mkdir -p "$pkgroot/Applications" "$pkgroot/Library/Audio/Plug-Ins/VST3"
          ditto "$app" "$pkgroot/Applications/OSTF Studio.app"
          ditto "$gm" "$pkgroot/Library/Audio/Plug-Ins/VST3/OSTF GM Sound Module.vst3"
          ditto "$arranger" "$pkgroot/Library/Audio/Plug-Ins/VST3/OSTF Arranger.vst3"
          while IFS= read -r name; do
            bundle="build/StudioEffects/Release/$name.vst3"
            lipo "$bundle/Contents/MacOS/$name" -verify_arch arm64
            test -s "$bundle/Contents/Resources/Licenses/GPL-3.0.txt"
            ditto "$bundle" "$pkgroot/Library/Audio/Plug-Ins/VST3/$name.vst3"
          done < <(jq -r '.[].name' src/plugins/effects/catalog.json src/plugins/instruments/catalog.json)
          cp third_party/tinysoundfont/LICENSE.txt "$staging/TinySoundFont-License.txt"
          components=$(mktemp -d)/components.plist
          pkgbuild --analyze --root "$pkgroot" "$components"
          python3 - "$components" <<'PY'
          import plistlib, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          components = plistlib.loads(path.read_bytes())
          def fix_locations(bundles):
              for bundle in bundles:
                  bundle["BundleIsRelocatable"] = False
                  fix_locations(bundle.get("ChildBundles", []))
          fix_locations(components)
          path.write_bytes(plistlib.dumps(components))
          PY
          pkgbuild --root "$pkgroot" --component-plist "$components" --install-location / --identifier org.ostf.studio.installer \
            --version '${{ steps.version.outputs.binary }}' "$staging/Install OSTF Studio and VST3.pkg"
          sudo installer -pkg "$staging/Install OSTF Studio and VST3.pkg" -target /
          while IFS= read -r name; do
            lipo "/Library/Audio/Plug-Ins/VST3/$name.vst3/Contents/MacOS/$name" -verify_arch arm64
          done < <(jq -sr '["OSTF Arranger", "OSTF GM Sound Module", (.[][] | .name)][]' src/plugins/effects/catalog.json src/plugins/instruments/catalog.json)
          hdiutil create -volname 'OSTF Studio' -srcfolder "$staging" -format UDZO "$dmg"
          hdiutil verify "$dmg"
      - name: Package corresponding source and build inputs
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/package-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OSTF-Studio-${{ matrix.name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.release_type == 'stable' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: OSTF-Studio-*
          path: dist
          merge-multiple: true
      - name: Create version tag and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: bash packaging/publish-release.sh
